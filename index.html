V.home=()=>`<div class="page"><section class="hero"><div class="txt"><span class="tag">🔥 Festive Sale – Flat 40% OFF</span><h1>Style jo <em>aapki pehchaan</em> bane</h1><p>Men, Women, Kids aur Shoes ka premium collection – sahi daam par, seedha aapke ghar tak.</p><a class="btn" href="#/shop">Shop Now →</a> <a class="btn ghost" style="color:#fff;border-color:#fff" href="#/shop?cat=Shoes">Explore Shoes</a></div><div class="art">👟</div></section><section class="perks"><div class="perk"><i>🚚</i><div><b>Free Delivery</b><small>On orders above ₹999</small></div></div><div class="perk"><i>💵</i><div><b>Cash on Delivery</b><small>Pay when you receive</small></div></div><div class="perk"><i>🔄</i><div><b>Easy Exchange</b><small>7 days size exchange</small></div></div><div class="perk"><i>📲</i><div><b>WhatsApp Order</b><small>Quick & simple</small></div></div></section><section class="sec"><h2>Shop by Category</h2><p class="sub">Apni pasand chuno</p><div class="cats">${[['Men','👔'],['Women','👗'],['Kids','🧒'],['Shoes','👟']].map(c=>`<a class="cat" href="#/shop?cat=${c[0]}"><i>${c[1]}</i><b>${c[0]}</b></a>`).join('')}</div></section><section class="sec"><div class="head"><div><h2>Trending Now</h2><p class="sub">Sabse zyada bik rahe products</p></div><a href="#/shop">View all →</a></div><div class="grid">${P.filter(p=>p.t).slice(0,8).map(card).join('')}</div></section><section class="sec"><div class="head"><div><h2>New Arrivals</h2><p class="sub">Fresh stock abhi aaya hai</p></div><a href="#/shop">View all →</a></div><div class="grid">${P.filter(p=>p.nw).slice(0,4).map(card).join('')}</div></section><section class="sec"><h2>Customer Reviews</h2><p class="sub">Hamare customers kya kehte hain</p><div class="reviews">${REV.map(r=>`<div class="rev"><div class="stars">${stars(r.r)}</div><p>“${r.t}”</p><b>${r.n}</b></div>`).join('')}</div></section><section class="sec"><div class="news"><h2>Get 10% off your first order</h2><p>Newsletter join karo – naye offers sabse pehle pao.</p><form onsubmit="event.preventDefault();toast('Thanks for subscribing! 🎉');this.reset()"><input type="email" required placeholder="Your email address" aria-label="Email"><button class="btn">Subscribe</button></form></div></section></div>`;
let F={cat:'All',size:'',color:'',max:3500,sort:'pop',q:'',wish:false};V.shop=params=>{if(params.has('cat'))F.cat=params.get('cat');F.wish=params.get('wish')=='1';if(params.has('q'))F.q=params.get('q');const sizes=[...new Set(P.flatMap(p=>p.s))];return `<div class="page"><h1 class="pt">${F.wish?'My Wishlist':'Shop'}</h1><div class="shop"><aside class="filters" id="flt"><h4>Category</h4><div class="chips">${['All','Men','Women','Kids','Shoes'].map(c=>`<button class="chip ${F.cat==c?'on':''}" onclick="setF('cat','${c}')">${c}</button>`).join('')}</div><h4>Size</h4><div class="chips">${sizes.map(s=>`<button class="chip ${F.size==s?'on':''}" onclick="setF('size','${F.size==s?'':s}')">${s}</button>`).join('')}</div><h4>Color</h4><div class="chips">${Object.keys(COLORS).map(c=>`<button class="sw ${F.color==c?'on':''}" title="${c}" style="background:${COLORS[c]}" onclick="setF('color','${F.color==c?'':c}')"></button>`).join('')}</div><h4>Max Price: <span id="pv">${inr(F.max)}</span></h4><input type="range" min="300" max="3500" step="100" value="${F.max}" oninput="$('#pv').textContent=inr(+this.value)" onchange="setF('max',+this.value)"><button class="btn ghost block" style="margin-top:16px" onclick="F={cat:'All',size:'',color:'',max:3500,sort:'pop',q:'',wish:false};$('#q').value='';location.hash='#/shop'">Reset</button></aside><div><div class="tb"><button class="btn ghost fbtn" onclick="$('#flt').classList.toggle('open')">⚙ Filters</button><span id="cnt"></span><select onchange="setF('sort',this.value)" aria-label="Sort"><option value="pop" ${F.sort=='pop'?'selected':''}>Popular</option><option value="lo" ${F.sort=='lo'?'selected':''}>Price: Low to High</option><option value="hi" ${F.sort=='hi'?'selected':''}>Price: High to Low</option><option value="rt" ${F.sort=='rt'?'selected':''}>Top Rated</option></select></div><div class="grid" id="pg">${shopList()}</div></div></div></div>`};function shopList(){let l=P.filter(p=>(F.cat=='All'||p.c==F.cat)&&(!F.size||p.s.includes(F.size))&&(!F.color||p.col.includes(F.color))&&p.p<=F.max&&(!F.q||(p.n+' '+p.c).toLowerCase().includes(F.q.toLowerCase()))&&(!F.wish||wish.includes(p.id)));if(F.sort=='lo')l.sort((a,b)=>a.p-b.p);if(F.sort=='hi')l.sort((a,b)=>b.p-a.p);if(F.sort=='rt')l.sort((a,b)=>b.r-a.r);setTimeout(()=>{const c=$('#cnt');if(c)c.textContent=l.length+' products'});return l.length?l.map(card).join(''):'<div class="empty" style="grid-column:1/-1"><i>🔎</i>Koi product nahi mila. Filters change karo.</div>'}function setF(k,v){F[k]=v;F.wish=location.hash.includes('wish=1');route(true)}
V.product=id=>{const p=P.find(x=>x.id==+id);if(!p)return V.nf();window._sel={size:p.s[0],color:p.col[0],q:1,id:p.id};return `<div class="page"><div class="pd"><div class="main"><img src="${img(p)}" alt="${p.n}"></div><div><span class="cat-l">${p.c}</span><h1>${p.n}</h1><div class="stars">${stars(p.r)} <small>(${p.r} rating)</small></div><div class="big">${inr(p.p)} <s style="font-size:1rem;color:var(--muted);font-weight:400">${inr(p.o)}</s> <span style="color:#16a34a;font-size:.95rem">${Math.round((1-p.p/p.o)*100)}% off</span></div><p style="color:var(--muted)">Premium quality material, comfortable fit aur long-lasting finish. Daily wear aur occasions dono ke liye perfect.</p><div class="row"><b>Size</b><div class="chips" id="szs">${p.s.map((s,i)=>`<button class="chip ${i?'':'on'}" onclick="pick('size','${s}',this,'#szs')">${s}</button>`).join('')}</div></div><div class="row"><b>Color</b><div class="chips" id="cls">${p.col.map((c,i)=>`<button class="sw ${i?'':'on'}" title="${c}" style="background:${COLORS[c]}" onclick="pick('color','${c}',this,'#cls')"></button>`).join('')}</div></div><div class="row"><b>Quantity</b><div class="qty"><button onclick="qchg(-1)">−</button><span id="qv">1</span><button onclick="qchg(1)">+</button></div></div><div class="acts"><button class="btn" onclick="addCart(${p.id},_sel.size,_sel.color,_sel.q)">🛒 Add to Cart</button><button class="btn wa" onclick="waOne(${p.id})">WhatsApp Order</button><button class="btn ghost" onclick="toggleWish(${p.id})">${wish.includes(p.id)?'❤️ Saved':'🤍 Wishlist'}</button></div></div></div><section class="sec"><h2>You may also like</h2><div class="grid">${P.filter(x=>x.c==p.c&&x.id!=p.id).slice(0,4).map(card).join('')}</div></section></div>`};function pick(k,v,el,sel){_sel[k]=v;$$(sel+' >*').forEach(b=>b.classList.remove('on'));el.classList.add('on')}function qchg(d){_sel.q=Math.max(1,_sel.q+d);$('#qv').textContent=_sel.q}function waLink(t){return `https://wa.me/${SHOP.wa}?text=${encodeURIComponent(t)}`}function waOne(id){const p=P.find(x=>x.id==id);window.open(waLink(`Hello ${SHOP.name}! Mujhe ye order karna hai:\n${p.n}\nSize: ${_sel.size}\nColor: ${_sel.color}\nQty: ${_sel.q}\nPrice: ${inr(p.p*_sel.q)}`),'_blank')}
V.cart=()=>{if(!cart.length)return `<div class="page empty"><i>🛒</i><h2>Your cart is empty</h2><p style="margin:10px 0 20px">Kuch accha sa add karo!</p><a class="btn" href="#/shop">Start Shopping</a></div>`;const t=total(),ship=t>=999?0:79;return `<div class="page"><h1 class="pt">My Cart</h1><div class="two"><div class="tbl">${cart.map((i,ix)=>{const p=P.find(x=>x.id==i.id);return `<div class="ci"><img src="${img(p)}" alt=""><div><b>${p.n}</b><br><small style="color:var(--muted)">Size ${i.size} · ${i.color}</small><div class="price">${inr(p.p)}</div><div class="qty" style="margin-top:6px"><button onclick="cq(${ix},-1)">−</button><span>${i.q}</span><button onclick="cq(${ix},1)">+</button></div></div><button class="x" onclick="cr(${ix})">✕ Remove</button></div>`}).join('')}</div><div class="box"><h3>Order Summary</h3><div class="ln"><span>Subtotal</span><span>${inr(t)}</span></div><div class="ln"><span>Delivery</span><span>${ship?inr(ship):'FREE'}</span></div><div class="ln t"><span>Total</span><span>${inr(t+ship)}</span></div><a class="btn block" style="margin-top:14px" href="#/checkout">Proceed to Checkout</a><button class="btn wa block" style="margin-top:10px" onclick="waCart()">Order on WhatsApp</button></div></div></div>`};function cq(i,d){cart[i].q=Math.max(1,cart[i].q+d);sv('jm_cart',cart);badges();route()}function cr(i){cart.splice(i,1);sv('jm_cart',cart);badges();route()}function cartText(){return cart.map((i,n)=>{const p=P.find(x=>x.id==i.id);return `${n+1}. ${p.n} (${i.size}, ${i.color}) x${i.q} = ${inr(p.p*i.q)}`}).join('\n')}function waCart(){window.open(waLink(`Hello ${SHOP.name}! Mera order:\n${cartText()}\nSubtotal: ${inr(total())}`),'_blank')}
V.checkout=()=>{if(!cart.length){location.hash='#/cart';return ''}const t=total(),ship=t>=999?0:79;return `<div class="page"><h1 class="pt">Checkout</h1><div class="two"><form class="box" id="cf" onsubmit="placeOrder(event)"><h3>Delivery Details</h3><div class="fld"><label>Full Name</label><input name="name" required></div><div class="fld"><label>Phone Number</label><input name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" required placeholder="10 digit number"></div><div class="fld"><label>Full Address</label><textarea name="addr" rows="3" required></textarea></div><div class="fld"><label>City / Pincode</label><input name="city" required></div><h3 style="margin-top:18px">Payment Method</h3><div class="pay"><label class="on"><input type="radio" name="pay" value="COD" checked>💵 Cash on Delivery</label><label><input type="radio" name="pay" value="UPI">📱 UPI</label></div><div class="upi" id="upib" hidden>UPI ID: <b>${SHOP.upi}</b> par <b>${inr(t+ship)}</b> bhejo aur order ke baad screenshot WhatsApp karo.</div><button class="btn block">Place Order · ${inr(t+ship)}</button></form><div class="box"><h3>Your Items</h3>${cart.map(i=>{const p=P.find(x=>x.id==i.id);return `<div class="ln"><span>${p.n} ×${i.q}</span><span>${inr(p.p*i.q)}</span></div>`}).join('')}<div class="ln"><span>Delivery</span><span>${ship?inr(ship):'FREE'}</span></div><div class="ln t"><span>Total</span><span>${inr(t+ship)}</span></div></div></div></div>`};document.addEventListener('change',e=>{if(e.target.name=='pay'){$$('.pay label').forEach(l=>l.classList.toggle('on',l.contains(e.target)));const up=$('#upib');if(up)up.hidden=e.target.value!='UPI'}});function placeOrder(e){e.preventDefault();const f=new FormData(e.target),t=total()+(total()>=999?0:79);const msg=`🛍 New Order – ${SHOP.name}\n\n${cartText()}\n\nTotal: ${inr(t)}\nPayment: ${f.get('pay')}\n\nName: ${f.get('name')}\nPhone: ${f.get('phone')}\nAddress: ${f.get('addr')}, ${f.get('city')}`;const id='JM'+Date.now().toString().slice(-6);cart=[];sv('jm_cart',cart);badges();$('#app').innerHTML=`<div class="page empty"><i>🎉</i><h2>Order Placed!</h2><p style="margin:8px 0">Order ID: <b>${id}</b></p><p>Confirm karne ke liye WhatsApp par order details bhejo.</p><br><a class="btn wa" target="_blank" rel="noopener" href="${waLink(msg)}">Send on WhatsApp</a> <a class="btn ghost" href="#/home">Continue Shopping</a></div>`;scrollTo(0,0)}
V.about=()=>`<div class="page"><h1 class="pt">About Us</h1><div class="about"><div><p style="color:var(--muted);margin-bottom:12px"><b style="color:var(--text)">${SHOP.name}</b> ek family-run store hai jahan hum quality kapde aur shoes sahi daam par dete hain. Hamara maksad hai har customer ko trendy, comfortable aur durable products dena – bina budget bigaade.</p><p style="color:var(--muted)">Men, Women aur Kids ki latest fashion se leke daily wear footwear tak, sab ek hi jagah.</p><div class="stats"><div><b>5000+</b>Happy Customers</div><div><b>500+</b>Products</div><div><b>10+</b>Years</div></div></div><div style="font-size:9rem;text-align:center">🏬</div></div></div>`;V.contact=()=>`<div class="page"><h1 class="pt">Contact Us</h1><div class="two"><form class="box" onsubmit="event.preventEvent();toast('Message sent! Hum jaldi reply karenge ✅');this.reset()"><div class="fld"><label>Name</label><input required></div><div class="fld"><label>Email / Phone</label><input required></div><div class="fld"><label>Message</label><textarea rows="4" required></textarea></div><button class="btn block">Send Message</button></form><div class="box"><h3>Visit / Call</h3><p class="ln">📍 ${SHOP.addr}</p><p class="ln">📞 ${SHOP.phone}</p><p class="ln">✉️ ${SHOP.email}</p><p class="ln">🕙 Mon–Sun, 10 AM – 9 PM</p><a class="btn wa block" target="_blank" rel="noopener" href="${waLink('Hello '+SHOP.name+'!')}">Chat on WhatsApp</a></div></div></div>`;V.nf=()=>`<div class="page empty"><i>😕</i><h2>Page not found</h2><br><a class="btn" href="#/home">Go Home</a></div>`;
function route(keepScroll){const h=location.hash.slice(1)||'/home',[path,qs]=h.split('?'),parts=path.split('/').filter(Boolean),name=parts[0]||'home',params=new URLSearchParams(qs||'');const view=V[name]||V.nf;$('#app').innerHTML=view(name=='product'?parts[1]:params);$$('#links a').forEach(a=>a.classList.toggle('on',a.dataset.r==name));$('#links').classList.remove('open');if(keepScroll!==true)scrollTo({top:0});const titles={home:'Home',shop:'Shop',cart:'Cart',checkout:'Checkout',about:'About',contact:'Contact'};document.title=(name=='product'?(P.find(x=>x.id==+parts[1])||{n:'Product'}).n:titles[name]||'Page')+' | '+SHOP.name}addEventListener('hashchange',()=>route());$('#burger').onclick=()=>$('#links').classList.toggle('open');$('#q').addEventListener('input',e=>{F.q=e.target.value;F.wish=false;if(!location.hash.startsWith('#/shop'))location.hash='#/shop?q='+encodeURIComponent(F.q);else $('#pg').innerHTML=shopList()});function theme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t=='dark'?'☀️':'🌙';try{localStorage.setItem('jm_theme',t)}catch{}}$('#theme').onclick=()=>theme(document.documentElement.dataset.theme=='dark'?'light':'dark');let st='light';try{st=localStorage.getItem('jm_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}theme(st);$('#waf').href=waLink('Hello '+SHOP.name+'! Mujhe help chahiye.');$('#yr').textContent=new Date().getFullYear();badges();route();
</script>
